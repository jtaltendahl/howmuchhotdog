<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Dog Logic</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 50px; 
            background-color: #ffe0b2; /* Subtle hot dog bun color */
        }
        .card { 
            background: white; 
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
            text-align: center; 
            max-width: 400px;
        }
        pre { 
            font-family: monospace; 
            font-size: 8px; 
            line-height: 1.2;
            color: #bf360c; /* Mustard/Ketchup-ish red-brown */
            margin-bottom: 20px;
            background: #fff9f0;
            padding: 10px;
            border-radius: 5px;
        }
        input { 
            padding: 10px; 
            font-size: 1.2rem; 
            width: 80%; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            margin-bottom: 1rem; 
        }
        button { 
            padding: 10px 25px; 
            font-size: 1.1rem; 
            background-color: #d84315; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover { background-color: #bf360c; }
        #result { 
            margin-top: 1.5rem; 
            font-size: 2.2rem; 
            font-weight: 800; 
            color: #333;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ASCII HOT DOG ART -->
        <pre>
       _..._
     .'     '.
    /  _   _  \
    | (o) (o) |
    |   _^_   | 
     \  '-'  /
  ____'-----'____
 (               )
  '-..._____...-'
  /             \
  |  HOT   DOG  |
  \             /
   '-.........-'
        </pre>

        <label for="dogInput" style="display: block; margin-bottom: 10px; font-weight: bold;">how many hot dog?</label>
        <input type="number" id="dogInput" step="0.00001" placeholder="0.00000">
        <br>
        <button onclick="calculateDogs()">Submit</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateDogs() {
            const input = document.getElementById('dogInput').value;
            if (input === "") return;

            // Round to 5 decimal places
            const num = parseFloat(parseFloat(input).toFixed(5));
            let resultText = "";

            if (num <= 1) {
                resultText = "hot dog";
            } else if (num > 1 && num < 2) {
                resultText = "hots dog";
            } else if (num >= 2) {
                resultText = "hots dogs";
            }

            document.getElementById('result').innerText = resultText;
        }
    </script>
</body>
</html>
